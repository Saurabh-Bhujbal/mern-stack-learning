    <h1>spread</h1>
    <p>to access each element separately from an iterable objects like array or string
        for ex;
        if we want to find max number from array it is need to use math.max() function <br>
        but instead of writing as this math.max(ar[0],ar[1]....) we use spread as <br>
        math.min(...ar);
    </p>
